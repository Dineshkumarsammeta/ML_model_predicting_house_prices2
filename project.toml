[project]
name = "ml-model-predicting-house-prices"
version = "1.0.0"
description = "Machine Learning Model for Predicting House Prices in the UK with Random Forest, XGBoost, and geospatial integration."
authors = [
    { name="Sammeta Dinesh Kumar", email="sammetadineshkumar@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["machine-learning", "house-prices", "real-estate", "xgboost", "random-forest", "uk-housing"]

[project.urls]
Homepage = "https://github.com/yourusername/ml-model-predicting-house-prices"
Documentation = "https://github.com/yourusername/ml-model-predicting-house-prices/wiki"
Issues = "https://github.com/yourusername/ml-model-predicting-house-prices/issues"
LinkedIn = "https://www.linkedin.com/in/dineshsammeta"

[tool.poetry.dependencies]
python = ">=3.9"
pandas = "^2.0.0"
numpy = "^1.25.0"
scikit-learn = "^1.3.0"
xgboost = "^1.7.6"
matplotlib = "^3.8.0"
seaborn = "^0.12.2"
geopandas = "^0.14.0"
folium = "^0.15.0"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
notebook = "^7.0.0"
pytest = "^7.4.0"
black = "^23.7.0"
flake8 = "^6.1.0"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.house-prices]
project_timeline = "2023-01-10 – 2023-03-12"
location = "UK (Academic Project, University of Leicester)"
supervisor = "Furqan Aziz"
type = "Big Data / Machine Learning"
data_sources = ["data.gov UK Housing Datasets", "Kaggle Housing Data", "Open APIs with geospatial features"]
